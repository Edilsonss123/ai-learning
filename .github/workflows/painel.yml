name: Painel de progresso

# Repositório privado: GitHub Pages desligado no plano gratuito.
# Para publicar a cada push (repo público ou GitHub Pro), descomente as 2 linhas de "push".
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: o painel conta commits por fase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_progress.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
